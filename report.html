<body>

  <!-- ══ PAGE HEADER ══ -->
  <div class="page-header">
    <img
      class="logo"
      src="https://cloud-1de12d.becdn.net/media/original/7b7d26a2b6416ed02135772cde49d24f/digiful-logo-blue_2x-100_d-crop_800x800.svg"
      alt="Digiful"
    >
    <p class="eyebrow">Client Retainer</p>
    <h1>Work Report</h1>
    <p class="header-desc">Your quarterly and monthly work summary, credit balance, and service status.</p>
  </div>

  <div class="page-wrap">

    <div id="status-bar" class="status loading">⏳ Loading your report…</div>
    <div id="info-bar" class="info-bar" style="display:none"></div>

    <div id="main" style="display:none">

      <!-- ══ BALANCE SUMMARY ══ -->
      <div class="balance-bar" id="balance-bar" style="display:none"></div>

      <!-- ══ QUARTER SUMMARY ══ -->
      <div class="section-box">
        <h2>Quarter overview</h2>
        <p class="section-subtitle">Credit spend across all months in this quarter.</p>
        <div id="quarter-summary"></div>
      </div>

      <!-- ══ MONTHLY DETAIL ══ -->
      <div class="section-box">
        <h2>Monthly detail</h2>
        <p class="section-subtitle">Work items and status for the selected month.</p>

        <!-- Month navigation -->
        <div class="month-nav">
          <button class="month-nav-btn" id="month-nav-prev" type="button" title="Previous month">&#8249;</button>
          <span class="month-nav-label" id="month-nav-label"></span>
          <button class="month-nav-btn" id="month-nav-next" type="button" title="Next month">&#8250;</button>
        </div>

        <!-- Month dropdown (alternative navigation) -->
        <select class="month-nav-select" id="month-nav-select" style="margin-bottom:16px;"></select>

        <!-- Work items list -->
        <div id="work-items"></div>

      </div>

    </div><!-- /main -->
  </div><!-- /page-wrap -->

  <!-- ServiceFlow scripts — order matters -->
